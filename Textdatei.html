<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Top Secret - Agenten Zugang</title>

    <style>
        /* ------ Globaler Spy/Agent-Look ------ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: radial-gradient(circle at center, #0a0f0a 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ff41;
            overflow: hidden;
        }

        /* Leichter Raster-Effekt (wie ein altes Terminal) */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 65, 0.03) 0px,
                rgba(0, 255, 65, 0.03) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        .container {
            background: rgba(10, 15, 10, 0.9);
            border: 2px solid #00ff41;
            box-shadow:
                0 0 40px rgba(0, 255, 65, 0.2),
                inset 0 0 20px rgba(0, 255, 65, 0.1);
            padding: 40px;
            border-radius: 12px;
            max-width: 800px;
            width: 90%;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        /* ------ Login-Bereich ------ */
        #login-screen {
            text-align: center;
        }

        .lock-icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 6px;
            text-shadow: 0 0 10px #00ff41;
            margin-bottom: 15px;
            font-weight: normal;
        }

        .subhead {
            color: #88ff99;
            margin-bottom: 30px;
            font-size: 1rem;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #pwd-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #00ff41;
            color: #00ff41;
            font-size: 1.8rem;
            padding: 10px 20px;
            width: 80%;
            max-width: 350px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 4px;
            outline: none;
            transition: 0.3s;
        }

        #pwd-input:focus {
            border-bottom-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 255, 65, 0.2);
        }

        #pwd-input::placeholder {
            color: #006622;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .btn {
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 12px 40px;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .btn:hover {
            background: #00ff41;
            color: #000000;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
        }

        #error-msg {
            margin-top: 15px;
            color: #ff3355;
            height: 20px;
            font-size: 0.9rem;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        /* ------ Erfolgs-Bereich (Passwort korrekt) ------ */
        #success-content {
            display: none;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #success-content h2 {
            color: #00ff41;
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00ff41;
        }

        .success-sub {
            color: #88ff99;
            margin-bottom: 25px;
            opacity: 0.7;
        }

        .video-wrapper {
            background: #000;
            border: 1px solid #00ff41;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15);
        }

        .video-wrapper video {
            display: block;
            width: 100%;
            max-height: 450px;
            border-radius: 4px;
            background: #111;
        }

        /* ------ Modal für das FALSCHE Passwort (Video-Overlay) ------ */
        #wrong-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: #0a0f0a;
            border: 2px solid #ff3355;
            padding: 30px 20px 20px 20px;
            border-radius: 12px;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 0, 50, 0.3);
        }

        .modal-content .warning {
            color: #ff3355;
            font-size: 1.2rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .modal-content video {
            width: 100%;
            max-height: 400px;
            border-radius: 6px;
            background: #000;
            border: 1px solid #ff3355;
        }

        .modal-close-note {
            color: #666;
            font-size: 0.8rem;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        /* ------ Responsive ------ */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.6rem;
            }
            #pwd-input {
                width: 100%;
                font-size: 1.4rem;
            }
            .btn {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- HAUPT-CONTAINER -->
    <div class="container">

        <!-- ===== LOGIN ===== -->
        <div id="login-screen">

            <span class="lock-icon">🕵️</span>

            <h1>Zugang gesperrt</h1>

            <p class="subhead">
                — Finde den Geheimagenten durch Eingabe des richtigen Zugangscodes.🔐 —
            </p>

            <div class="input-group">

                <input
                    type="password"
                    id="pwd-input"
                    placeholder="Codewort eingeben..."
                    autofocus
                >

                <button class="btn" onclick="checkPassword()">
                    ⏎ Entsperren
                </button>

                <div id="error-msg"></div>

            </div>
        </div>


        <!-- ===== PASSWORT KORREKT ===== -->
        <div id="success-content">

            <h2>✅ ZUGRIFF GEWÄHRT</h2>

            <p class="success-sub">
                — Welcome Agent 0.0 Bride —
            </p>

            <div class="video-wrapper">

                <!-- RICHTIGES VIDEO (Dropbox) – autoplay entfernt -->
                <video
                    id="correct-video"
                    controls
                    playsinline
                    preload="metadata"
                >
                    <source
                        src="https://www.dropbox.com/scl/fi/xj2o0oil6b2faeth1x9lq/VID_20260818_184250.mp4?rlkey=15crsihf7bms5fev77wr99asa&st=sqyfuxwh&raw=1"
                        type="video/mp4"
                    >
                    Dein Browser unterstützt dieses Videoformat nicht.
                </video>

            </div>

            <p style="margin-top:15px; color:#00ff41; opacity:0.6; font-size:1.0rem;">
                52.55336884143027, 13.33223385154709 🛰️
            </p>

        </div>

    </div>


    <!-- ===== MODAL: FALSCHES PASSWORT ===== -->
    <div id="wrong-modal">

        <div class="modal-content">

            <div class="warning">
                🚨 ZUTRITT VERWEIGERT 🚨
            </div>

            <!-- FALSCHES VIDEO (Dropbox) – autoplay ebenfalls entfernt (war eh nicht da) -->
            <video
                id="wrong-video"
                controls
                playsinline
                preload="metadata"
            >
                <source
                    src="https://www.dropbox.com/scl/fi/r5g5z1r0lpj7segn7uvgn/VID-20260818-WA0001.mp4?rlkey=luy86kzez1lrrtffa87nk4974&st=82sznxs3&raw=1"
                    type="video/mp4"
                >
                Dein Browser unterstützt dieses Videoformat nicht.
            </video>

            <p class="modal-close-note">
                Ah Ah Ah 🤓👎 Das war falsch!
            </p>

        </div>

    </div>


    <script>

        // ----- KONFIGURATION -----
        const CORRECT_PASSWORD = "Nicole2020";

        // ----- DOM-REFERENZEN -----
        const loginScreen = document.getElementById('login-screen');
        const successContent = document.getElementById('success-content');
        const errorMsg = document.getElementById('error-msg');
        const pwdInput = document.getElementById('pwd-input');
        const wrongModal = document.getElementById('wrong-modal');
        const wrongVideo = document.getElementById('wrong-video');
        const correctVideo = document.getElementById('correct-video');

        let isWrongVideoPlaying = false;

        // ----- HAUPTFUNKTION: PASSWORT PRÜFEN -----
        function checkPassword() {

            const inputPwd = pwdInput.value.trim();
            errorMsg.innerText = '';

            // =========================================
            // 1. FALL: PASSWORT IST RICHTIG
            // =========================================
            if (inputPwd === CORRECT_PASSWORD) {

                loginScreen.style.display = 'none';
                successContent.style.display = 'block';
                correctVideo.currentTime = 0;
                correctVideo.play().catch(e => {
                    console.warn('Das richtige Video konnte nicht automatisch abgespielt werden:', e);
                });
                return;
            }

            // =========================================
            // 2. FALL: PASSWORT IST FALSCH
            // =========================================
            errorMsg.innerText = '❌ Falscher Code! Zugang verweigert.';

            if (!isWrongVideoPlaying) {

                isWrongVideoPlaying = true;
                wrongModal.style.display = 'flex';
                wrongVideo.currentTime = 0;

                wrongVideo.play().catch(e => {
                    console.warn('Video konnte nicht abgespielt werden:', e);
                    alert('Das falsche Video konnte nicht geladen werden. Bitte überprüfe die Dropbox-Freigabe.');
                    wrongModal.style.display = 'none';
                    isWrongVideoPlaying = false;
                    pwdInput.value = '';
                    pwdInput.focus();
                });

                // Video zu Ende → Modal schließen
                wrongVideo.onended = function () {
                    wrongModal.style.display = 'none';
                    isWrongVideoPlaying = false;
                    pwdInput.value = '';
                    pwdInput.focus();
                };

                // Sicherheits-Timeout (15 Sekunden)
                setTimeout(() => {
                    if (wrongModal.style.display === 'flex') {
                        wrongVideo.pause();
                        wrongModal.style.display = 'none';
                        isWrongVideoPlaying = false;
                        pwdInput.value = '';
                        pwdInput.focus();
                    }
                }, 15000);

            } else {
                pwdInput.value = '';
                pwdInput.focus();
            }
        }

        // ----- ENTER-TASTE -----
        pwdInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                checkPassword();
            }
        });

        // ----- FOKUS BEIM LADEN -----
        window.onload = function() {
            pwdInput.focus();
        };

        console.log('🔑 Agenten-Schnitzeljagd geladen.');
    </script>

</body>
</html>
